# Variables репозитория pingtower/tg-bot → Kubernetes Secret.
# Настройки Variables: Masked, Protected, environment scope *, Expand выключен.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tg-bot
  namespace: pingtower
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gitlab-pingtower-tg-bot
    kind: SecretStore
  target:
    name: tg-bot
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: bot-token
      remoteRef:
        key: TG_BOT_BOT_TOKEN
    - secretKey: webhook-secret
      remoteRef:
        key: TG_BOT_WEBHOOK_SECRET
