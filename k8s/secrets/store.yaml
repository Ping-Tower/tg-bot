# Читает Variables из проекта pingtower/tg-bot.
# projectID замени на числовой ID перед первым деплоем.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gitlab-pingtower-tg-bot
  namespace: pingtower
spec:
  provider:
    gitlab:
      url: https://gitlab.com
      projectID: "REPLACE_WITH_TG_BOT_PROJECT_ID"
      environment: "*"
      auth:
        SecretRef:
          accessToken:
            name: gitlab-token
            key: token
