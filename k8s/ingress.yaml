# Telegram API дергает webhook извне: нужен публичный HTTPS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tg-bot
  namespace: pingtower
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [tg.pingtower.tech]
      secretName: tg-bot-tls
  rules:
    - host: tg.pingtower.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tg-bot
                port:
                  name: http
