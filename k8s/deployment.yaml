apiVersion: apps/v1
kind: Deployment
metadata:
  name: tg-bot
  namespace: pingtower
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tg-bot
  template:
    metadata:
      labels:
        app: tg-bot
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: tg-bot
          image: registry.gitlab.com/pingtower/tg-bot:REPLACE_WITH_COMMIT_SHA
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tg-bot
          env:
            # Собираем TG_BOT_RABBITMQ_URL из infra настроек и пароля брокера.
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: pingtower-infra
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: pingtower-infra
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USER
              valueFrom:
                configMapKeyRef:
                  name: pingtower-infra
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: password
            # faststream[uamqp]: vhost / — в URL в конце.
            - name: TG_BOT_RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)/"
            - name: TG_BOT_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tg-bot
                  key: bot-token
            - name: TG_BOT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: tg-bot
                  key: webhook-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
