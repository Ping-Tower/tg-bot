stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

# Test job is kept as-is from the repo's own pipeline (unittest, not pytest).
tests:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir uv
    - uv sync --frozen
    - uv run python -m unittest discover -s tests

build_image:
  stage: build
  image: docker:27.5.0
  services:
    - docker:27.5.0-dind
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: 1
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - docker buildx create --use --driver docker-container --driver-opt network=host
    - docker buildx build --pull --provenance=false --sbom=false
        --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:buildcache
        --cache-to type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max
        -t $DOCKER_IMAGE_NAME --push .

# K8s-deploy: манифесты в k8s/, деплой через GitLab Agent.
deploy:
  stage: deploy
  needs: [build_image]
  image:
    name: alpine/kubectl:1.37.1
    entrypoint: [""]
  tags: [saas-linux-small-amd64]
  resource_group: pingtower-production
  environment:
    name: production
    url: https://tg.pingtower.tech
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  allow_failure: false
  manual_confirmation: "Развернуть tg-bot в production?"
  timeout: 20m
  script:
    - kubectl config use-context pingtower/infra:pingtower
    - sed -i "s/REPLACE_WITH_COMMIT_SHA/$CI_COMMIT_SHA/g" k8s/kustomization.yaml
    - kubectl apply --dry-run=server -k k8s/
    # Секреты приложения (Store tg-bot → ExternalSecret tg-bot).
    - kubectl -n pingtower apply -f k8s/secrets/store.yaml
    - kubectl -n pingtower wait --for=condition=Ready secretstore/gitlab-pingtower-tg-bot --timeout=120s
    - kubectl -n pingtower apply -f k8s/secrets/external-secrets.yaml
    - kubectl -n pingtower wait --for=condition=Ready externalsecret/tg-bot --timeout=120s
    # Инфраструктурные секреты — владелец pingtower-infra.
    - kubectl -n pingtower wait --for=condition=Ready
        externalsecret/rabbitmq externalsecret/gitlab-registry --timeout=120s
    - kubectl -n pingtower get secret tg-bot rabbitmq gitlab-registry -o name
    - kubectl -n pingtower apply -f k8s/service.yaml -f k8s/ingress.yaml
    - kubectl -n pingtower wait --for=create certificate/tg-bot-tls --timeout=60s
    - kubectl -n pingtower wait --for=condition=Ready certificate/tg-bot-tls --timeout=600s
    - kubectl apply -k k8s/
    - kubectl -n pingtower rollout status deployment/tg-bot --timeout=600s
