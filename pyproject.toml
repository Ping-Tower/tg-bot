[project]
name = "pingtower-tg-bot"
version = "0.1.0"
description = "Telegram bot worker for PingTower notifications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22.0,<4.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "faststream[rabbit]>=0.6.0,<0.7.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "uvicorn>=0.32.0,<1.0.0",
]

[project.scripts]
tg-bot = "tg_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_bot"]

[tool.uv]
package = true
